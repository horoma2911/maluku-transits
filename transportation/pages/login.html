<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MALUKU LOGISTICS</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="../pwa/manifest.json">
  <link rel="icon" href="/icons/icon-192x192.png">
  <meta name="theme-color" content="#003333">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">K</div>
        <h1>MALUKU LOGISTICS</h1>
        <p>Sign in to your account</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address <span class="required">*</label>
          <input type="email" id="login-email" class="form-control" placeholder="admin@kasuku.co.tz" value="admin@kasuku.co.tz" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password <span class="required">*</label>
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
        </div>
        <div class="form-group d-flex align-center justify-between">
          <label class="d-flex align-center gap-2 cursor-pointer">
            <input type="checkbox" id="login-remember" checked> Remember me
          </label>
          <a href="#" class="text-primary text-sm font-weight-600" id="show-forgot">Forgot password?</a>
        </div>
        <div id="login-error" class="text-danger text-sm mb-2" style="display:none;"></div>
        <button type="submit" class="btn btn-primary w-full justify-end p-4">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <form id="forgot-form" style="display:none;">
        <div id="forgot-step-1">
          <p class="text-sm mb-3" style="color: var(--text-secondary);">Enter your email address to generate a password reset token.</p>
          <div class="form-group">
            <label class="form-label">Email Address <span class="required">*</label>
            <input type="email" id="forgot-email" class="form-control" placeholder="admin@kasuku.co.tz" required>
          </div>
          <div id="forgot-error" class="text-danger text-sm mb-2" style="display:none;"></div>
          <button type="submit" class="btn btn-primary w-full justify-end p-4">
            <i class="fas fa-paper-plane"></i> Generate Reset Token
          </button>
        </div>
        <div id="forgot-step-2" style="display:none;">
          <div class="alert alert-info mb-3">
            <i class="fas fa-key"></i> Copy this reset token:
            <code id="reset-token-display" style="display:block; margin-top:6px; font-size:12px; word-break:break-all;"></code>
          </div>
          <div class="form-group">
            <label class="form-label">New Password <span class="required">*</label>
            <input type="password" id="reset-new-password" class="form-control" placeholder="Min 6 characters" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password <span class="required">*</label>
            <input type="password" id="reset-confirm-password" class="form-control" placeholder="Repeat password" required minlength="6">
          </div>
          <div id="reset-error" class="text-danger text-sm mb-2" style="display:none;"></div>
          <button type="submit" class="btn btn-primary w-full justify-end p-4">
            <i class="fas fa-check"></i> Reset Password
          </button>
        </div>
        <button type="button" class="btn btn-secondary w-full justify-center p-4 mt-3" id="back-to-login">
          <i class="fas fa-arrow-left"></i> Back to Login
        </button>
      </form>
      <div class="login-footer">
        &copy; 2024 MALUKU LOGISTICS. All rights reserved.
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    var API_BASE = window.API_BASE;
    if (!API_BASE) {
      var base = window.location.origin + window.location.pathname;
      base = base.substring(0, base.lastIndexOf('/') + 1);
      API_BASE = base.replace(/\/pages\/?$/, '/') + 'api';
    }

    var loginForm = document.getElementById('login-form');
    var forgotForm = document.getElementById('forgot-form');
    var forgotStep1 = document.getElementById('forgot-step-1');
    var forgotStep2 = document.getElementById('forgot-step-2');
    var resetToken = '';

    function showError(id, msg) {
      var el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError(id) {
      var el = document.getElementById(id);
      el.style.display = 'none';
    }
    function showLogin() {
      loginForm.style.display = 'block';
      forgotForm.style.display = 'none';
      forgotStep1.style.display = 'block';
      forgotStep2.style.display = 'none';
      hideError('login-error');
      hideError('forgot-error');
      hideError('reset-error');
    }
    function showForgot() {
      loginForm.style.display = 'none';
      forgotForm.style.display = 'block';
      forgotStep1.style.display = 'block';
      forgotStep2.style.display = 'none';
      hideError('forgot-error');
      hideError('reset-error');
    }

    document.getElementById('show-forgot').addEventListener('click', function (e) {
      e.preventDefault();
      showForgot();
    });
    document.getElementById('back-to-login').addEventListener('click', showLogin);

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value;
      var errorEl = document.getElementById('login-error');
      errorEl.style.display = 'none';

      if (!email || !password) {
        errorEl.textContent = 'Please enter your email and password.';
        errorEl.style.display = 'block';
        return;
      }

      Utils.showLoader();
      fetch(API_BASE + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      })
        .then(function (res) {
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (result) {
          Utils.hideLoader();
          if (!result.ok) {
            errorEl.textContent = (result.data && result.data.error) || 'Login failed.';
            errorEl.style.display = 'block';
            return;
          }
          var store = document.getElementById('login-remember').checked
            ? localStorage : sessionStorage;
          store.setItem('auth_token', result.data.token);
          store.setItem('auth_user', JSON.stringify(result.data.user));
          window.location.href = 'dashboard.html';
        })
        .catch(function () {
          Utils.hideLoader();
          if (window.location.protocol === 'file:') {
            errorEl.textContent = 'This page must be served by the backend. Open it via http://localhost:8000/ (or your deployed URL), not by double-clicking the file.';
          } else {
            errorEl.textContent = 'Unable to reach the server at ' + API_BASE + '. Please try again.';
          }
          errorEl.style.display = 'block';
        });
    });

    forgotForm.addEventListener('submit', function (e) {
      e.preventDefault();

      if (forgotStep1.style.display !== 'none') {
        var email = document.getElementById('forgot-email').value.trim();
        if (!email) {
          showError('forgot-error', 'Please enter your email address.');
          return;
        }
        Utils.showLoader();
        console.log('Requesting reset for:', email);
        API.forgotPassword(email)
          .then(function (res) {
            Utils.hideLoader();
            console.log('Forgot response:', res);
            resetToken = res.token || '';
            if (!resetToken) {
              showError('forgot-error', 'Server did not return a token. Contact support.');
              return;
            }
            document.getElementById('reset-token-display').textContent = resetToken;
            forgotStep1.style.display = 'none';
            forgotStep2.style.display = 'block';
            hideError('forgot-error');
          })
          .catch(function (err) {
            Utils.hideLoader();
            console.error('Forgot error:', err);
            var msg = (err.data && err.data.error) || ('Request failed (HTTP ' + (err.status || '?') + ')');
            showError('forgot-error', msg);
          });
      } else {
        var token = resetToken;
        var password = document.getElementById('reset-new-password').value;
        var confirm = document.getElementById('reset-confirm-password').value;
        if (!token || !password) {
          showError('reset-error', 'All fields are required.');
          return;
        }
        if (password !== confirm) {
          showError('reset-error', 'New passwords do not match.');
          return;
        }
        if (password.length < 6) {
          showError('reset-error', 'Password must be at least 6 characters.');
          return;
        }
        Utils.showLoader();
        console.log('Resetting with token:', token);
        API.resetPassword(token, password)
          .then(function (res) {
            Utils.hideLoader();
            console.log('Reset success:', res);
            Utils.toast('Password reset successful. Please log in.', 'success');
            showLogin();
          })
          .catch(function (err) {
            Utils.hideLoader();
            console.error('Reset error:', err);
            var msg = (err.data && err.data.error) || ('Request failed (HTTP ' + (err.status || '?') + ')');
            showError('reset-error', msg);
          });
      }
    });
  </script>
</body>
</html>
